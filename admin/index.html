<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<!-- Тема применяется ДО первой отрисовки: иначе кабинет мигает тёмным -->
<script>(function(){try{var d=document.documentElement;
var c=localStorage.getItem('medoeduz_theme')||'dark';
var t=c==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):c;
d.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}})();</script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#07080B">
    <title>Кабинет администратора | MedoEDUz</title>
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../fonts/fonts.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="app">
        <!-- Экран входа -->
        <div class="login" id="login" hidden></div>

        <!-- Кабинет -->
        <div class="shell" id="shell" hidden></div>
    </div>

    <div class="toast" id="toast"></div>

    <!--
        Порядок важен: конфигурация → модель курса → клиент API →
        оверлей (правит модель) → схемы → логика кабинета.
        Оверлей обязан отработать ДО того, как admin.js прочитает
        модель, иначе редактор покажет базовую версию поверх правок.
    -->
    <script src="../js/config.js"></script>
    <script src="../js/data/curriculum.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/model-overlay.js"></script>
    <script src="schema.js"></script>
    <script src="admin.js"></script>
    <script src="../js/theme.js"></script>
</body>
</html>
