name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Позволяет запустить деплой вручную из любой ветки:
  # вкладка Actions -> Deploy to GitHub Pages -> Run workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Собираем чистую директорию для публикации.
      # Важно: НЕ выгружаем весь репозиторий — иначе в артефакт попадают
      # node_modules, .git и служебные файлы (это раздувает деплой).
      - name: Build site directory
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '_site' \
            --exclude '*.zip' \
            --exclude '*.tar.gz' \
            --exclude 'Dockerfile' \
            --exclude 'docker-compose.yml' \
            --exclude 'nginx.conf' \
            --exclude 'build-app.sh' \
            --exclude '.env*' \
            ./ _site/
          # Служебные папки удаляем явно после копирования — надёжнее, чем
          # полагаться на трактовку --exclude для директорий в разных
          # версиях rsync (worker/ и docs/ ранее просачивались на Pages:
          # серверный код и внутренние доки не должны быть публичными).
          rm -rf _site/worker _site/docs _site/api
          # Отключаем обработку Jekyll (иначе игнорируются файлы с _ и .)
          touch _site/.nojekyll
          echo "--- содержимое _site ---"
          find _site -maxdepth 1 | sort

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
