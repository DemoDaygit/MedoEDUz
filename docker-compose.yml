version: '3.8'

services:
  # Frontend (статический сайт)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medoeduz-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - medoeduz-network
    environment:
      - NODE_ENV=production
    volumes:
      - ./logs:/var/log/nginx

