# Конфигурация Cloudflare Worker для синхронизации прогресса MedoEDUz.
# Развёртывание: см. worker/README.md.

name = "medoeduz-sync"
main = "index.js"
compatibility_date = "2024-11-01"

# KV-хранилище прогресса. ID подставляется после создания:
#   npx wrangler kv namespace create PROGRESS
[[kv_namespaces]]
binding = "PROGRESS"
id = "ЗАМЕНИТЬ_НА_ID_ПОСЛЕ_СОЗДАНИЯ"

# BOT_TOKEN задаётся как секрет, НЕ здесь:
#   npx wrangler secret put BOT_TOKEN
# Токен никогда не хранится в репозитории и не отдаётся клиенту.
