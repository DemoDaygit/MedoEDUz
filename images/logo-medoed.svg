<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Кибермедоед">
  <!--
    Знак MedoEDUz — кибермедоед.
    Профиль: у животного силуэт читается мгновенно, фронтальный ракурс
    на мелких размерах вырождается в «гуманоида».
    Признаки медоеда заложены в пропорции: коренастая голова, короткая
    тупая морда, маленькое ухо и светлая «мантия» по верху.
    Цвета — через CSS-переменные; значения по умолчанию для favicon.
  -->
  <defs>
    <linearGradient id="mdCape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--logo-cape-hi, #f4f8ff)"/>
      <stop offset="1" stop-color="var(--logo-cape, #a9b8d2)"/>
    </linearGradient>
  </defs>

  <!-- ухо: небольшое, но выступает над линией макушки -->
  <path d="M17 23 C 15.5 15.5, 21 13, 24.5 17.5 C 25.8 19.2, 25.8 21, 25.2 22.5 Z"
        fill="var(--logo-fur, #26314a)"/>

  <!-- голова в профиль: коренастая, морда короткая и тупая -->
  <path d="M52.5 30.5
           C 48 25.5, 41 22.5, 33.5 21.5
           C 26 20.5, 18 21.5, 13 26
           C 8 30.5, 7.5 39, 12.5 44.5
           C 17.5 50, 27 50.5, 34.5 46.5
           C 42 42.5, 49.5 35.5, 52.5 30.5 Z"
        fill="var(--logo-fur, #26314a)"/>

  <!-- мантия: светлая полоса по верху головы и спине -->
  <path d="M33.5 21.5
           C 26 20.5, 18 21.5, 13 26
           C 8 30.5, 7.5 39, 12.5 44.5
           L 16 38.5
           C 13.5 34.5, 14.5 30.5, 18 27.8
           C 21.5 25, 27.5 24.5, 34.5 25.8 Z"
        fill="url(#mdCape)"/>

  <!-- дорожки «схемы» по мантии -->
  <g stroke="var(--logo-circuit, #5d7192)" stroke-width="1" fill="none"
     opacity=".5" stroke-linecap="round">
    <path d="M14.5 34 H19.5"/>
    <path d="M21 29 H27"/>
  </g>

  <!-- глаз: светящийся визир -->
  <path d="M30 29.5 L38 31.5 L37.5 34 L29.5 32.5 Z" fill="var(--logo-eye, #22d3ee)"/>

  <!-- нос: клин на самом конце морды, сросшийся с силуэтом -->
  <path d="M52.5 30.5 C 50.5 32.5, 48.5 34.5, 46.5 36
           C 47.5 32.5, 49.5 30.5, 52.5 30.5 Z"
        fill="var(--logo-cape, #a9b8d2)"/>

  <!-- линия пасти -->
  <path d="M38 41 C 43 39, 47.5 36, 50.5 33"
        stroke="var(--logo-cape, #a9b8d2)" stroke-width="1.2" fill="none"
        opacity=".4" stroke-linecap="round"/>
</svg>
