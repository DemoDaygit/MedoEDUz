<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MedoEDUz">
  <!--
    Фавикон MedoEDUz.
    Намеренно проще основного знака: на 16px детальный профиль зверя
    вырождается в пятно, поэтому здесь оставлены только два опознаваемых
    элемента — светлая «мантия» медоеда и светящийся визир кибермедоеда.
  -->
  <defs>
    <linearGradient id="fvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b2e"/>
      <stop offset="1" stop-color="#080b14"/>
    </linearGradient>
    <linearGradient id="fvCape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#9fb0cc"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#fvBg)"/>

  <!-- мантия: широкая дуга через тайл -->
  <path d="M8 44 C 12 22, 28 10, 52 12 L 52 25 C 33 24, 22 32, 19 47 Z"
        fill="url(#fvCape)"/>

  <!-- визир -->
  <rect x="30" y="34" width="20" height="6.5" rx="3.25" fill="#22d3ee"/>
</svg>
