<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MedoEDUz">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="MedoEDUz — автономная игровая экосистема обучения ИИ. Работает офлайн на Android и iOS.">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>MedoEDUz — Игровая экосистема</title>
<style>
    :root {
        --bg: #07080B;
        --bg2: #151921;
        --surface: rgba(158, 173, 196, 0.06);
        --surface-border: rgba(158, 173, 196, 0.14);
        --text: #E8EDF5;
        --text-dim: #9FADC0;
        --primary: #22E0C8;
        --accent: #8B7CFF;
        --gold: #FFB020;
        --success: #3FD87A;
        --aura: #FFB020;
        --radius: 18px;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
    }

    #fx {
        position: fixed;
        inset: 0;
        z-index: 0;
    }

    .app {
        position: relative;
        z-index: 1;
        height: 100dvh;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 12px);
        overflow-y: auto;
        background:
            radial-gradient(120% 80% at 50% -10%, rgba(34, 224, 200, 0.16), transparent 60%),
            radial-gradient(100% 60% at 50% 110%, rgba(139, 124, 255, 0.14), transparent 60%);
    }

    /* ---------- Хедер ---------- */
    .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
    }

    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1rem; }
    .brand b { color: var(--primary); }

    .level-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--surface);
        border: 1px solid var(--surface-border);
        padding: 6px 12px;
        border-radius: 50px;
        font-weight: 700;
        font-size: 0.85rem;
    }
    .level-pill b { color: var(--gold); }

    /* ---------- Маскот ---------- */
    .hero {
        text-align: center;
        padding: 8px 0 4px;
    }
    .mascot {
        position: relative;
        width: 150px;
        height: 150px;
        margin: 0 auto;
        display: grid;
        place-items: center;
    }
    .mascot__glow {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--aura);
        filter: blur(34px);
        opacity: 0.55;
        animation: spin 9s linear infinite;
    }
    .mascot__emoji {
        position: relative;
        font-size: 5.5rem;
        line-height: 1;
        animation: bob 3.5s ease-in-out infinite;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
    }
    .stage-name { font-weight: 800; font-size: 1.35rem; margin-top: 6px; }
    .stage-sub { color: var(--text-dim); font-size: 0.85rem; }

    /* ---------- XP бар ---------- */
    .xp {
        margin: 14px 4px 6px;
    }
    .xp__row { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 6px; }
    .xp__bar { height: 14px; background: rgba(255, 255, 255, 0.08); border-radius: 8px; overflow: hidden; border: 1px solid var(--surface-border); }
    .xp__fill {
        height: 100%;
        width: 0%;
        border-radius: 8px;
        background: linear-gradient(90deg, var(--primary), var(--accent));
        background-size: 200% 100%;
        animation: shimmer 2.5s linear infinite;
        transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ---------- Кнопка изучения ---------- */
    .tap-wrap { display: grid; place-items: center; padding: 10px 0; }
    .tap {
        position: relative;
        width: 168px;
        height: 168px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        color: #04120F;
        font-weight: 800;
        font-size: 1.05rem;
        letter-spacing: 0.04em;
        background: radial-gradient(circle at 30% 30%, var(--primary), #12C4AE 70%);
        box-shadow: 0 12px 30px rgba(34, 224, 200, 0.45), inset 0 -6px 16px rgba(0, 0, 0, 0.3), inset 0 6px 14px rgba(255, 255, 255, 0.25);
        touch-action: manipulation;
        transition: transform 0.08s ease;
        overflow: hidden;
    }
    .tap:active { transform: scale(0.94); }
    .tap__label { position: relative; z-index: 2; display: block; }
    .tap__hint { display: block; font-size: 0.7rem; opacity: 0.75; font-weight: 600; margin-top: 4px; }

    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        transform: translate(-50%, -50%) scale(0);
        pointer-events: none;
        animation: ripple 0.6s ease-out forwards;
        z-index: 1;
    }

    /* ---------- Заголовки секций ---------- */
    .sec-label {
        display: flex; align-items: center; justify-content: space-between;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: .7rem; letter-spacing: .08em; text-transform: uppercase;
        color: var(--text-dim); margin: 16px 4px 8px; font-weight: 500;
    }
    .sec-count { color: var(--primary); }

    /* ---------- Граф знаний ---------- */
    .graph {
        position: relative;
        height: 46vh; min-height: 300px;
        border-radius: var(--radius);
        border: 1px solid var(--surface-border);
        background:
            radial-gradient(circle at 25% 20%, rgba(34,224,200,.08), transparent 45%),
            radial-gradient(circle at 75% 80%, rgba(139,124,255,.08), transparent 45%),
            #0D0F14;
        overflow: hidden;
        touch-action: none;
    }
    .graph::before {
        content:''; position:absolute; inset:0; pointer-events:none;
        background-image:
            linear-gradient(rgba(158,173,196,.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(158,173,196,.05) 1px, transparent 1px);
        background-size: 38px 38px;
    }
    .graph__svg { position:absolute; inset:0; width:100%; height:100%; }

    .graph__ctrl { position:absolute; right:8px; bottom:8px; display:flex; flex-direction:column; gap:6px; z-index:2; }
    .graph__ctrl button {
        width:36px; height:36px; border-radius:9px;
        border:1px solid var(--surface-border); background:var(--bg2);
        color:var(--text); font-size:1.05rem; font-weight:700; cursor:pointer;
        touch-action: manipulation;
    }
    .graph__hint {
        position:absolute; left:10px; bottom:12px; z-index:2;
        font-size:.64rem; color:var(--text-dim); opacity:.75; pointer-events:none;
    }

    /* Узлы графа */
    .gn { cursor:pointer; }
    .gn__halo { opacity:0; }
    .gn__circle { fill:#151921; stroke:var(--surface-border); stroke-width:2.5; }
    .gn__icon { font-size:19px; pointer-events:none; }
    .gn__label { fill:var(--text-dim); font-size:9px; font-weight:600; pointer-events:none; }

    .gn.is-locked .gn__icon { opacity:.45; filter:grayscale(1); }
    .gn.is-locked .gn__label { opacity:.5; }

    .gn.is-available .gn__circle { stroke:var(--branch); stroke-dasharray:5 4; }
    .gn.is-available .gn__halo { opacity:.2; animation: gpulse 2.4s ease-in-out infinite; }

    .gn.is-done .gn__circle { fill:var(--branch); stroke:var(--branch); }
    .gn.is-done .gn__label { fill:var(--text); font-weight:700; }

    /* Появление нового узла: граф «прорастает» */
    .gn.is-new .gn__inner { animation: gsprout .55s cubic-bezier(.34,1.56,.64,1); }
    @keyframes gsprout { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
    @keyframes gpulse { 0%,100%{opacity:.12} 50%{opacity:.3} }

    .ge { fill:none; stroke:var(--surface-border); stroke-width:2; }
    .ge.is-half { stroke:var(--accent); opacity:.45; }
    .ge.is-full { stroke:var(--primary); stroke-width:2.5; stroke-dasharray:7 5; animation: gflow 1s linear infinite; }
    @keyframes gflow { to { stroke-dashoffset:-12 } }

    /* ---------- Прогресс по веткам ---------- */
    .bars { display:flex; flex-direction:column; gap:9px; padding-bottom:6px; }
    .bar__top { display:flex; justify-content:space-between; align-items:center; font-size:.78rem; margin-bottom:4px; }
    .bar__name { color:var(--text); }
    .bar__num { font-family:'JetBrains Mono', ui-monospace, monospace; font-size:.7rem; color:var(--text-dim); }
    .bar__track { height:7px; border-radius:4px; background:rgba(158,173,196,.1); overflow:hidden; }
    .bar__fill { height:100%; border-radius:4px; width:0; transition:width .6s cubic-bezier(.22,1,.36,1); }

    /* ---------- Шторка курса ---------- */
    .sheet { position:fixed; inset:0; z-index:120; visibility:hidden; pointer-events:none; }
    .sheet.is-open { visibility:visible; pointer-events:auto; }
    .sheet__bg { position:absolute; inset:0; background:rgba(4,5,8,.8); opacity:0; transition:opacity .3s; }
    .sheet.is-open .sheet__bg { opacity:1; }
    .sheet__body {
        position:absolute; left:0; right:0; bottom:0;
        max-height:88vh; overflow-y:auto;
        background:var(--bg2); border-top:1px solid var(--surface-border);
        border-radius:20px 20px 0 0;
        padding:18px 16px calc(var(--safe-b) + 24px);
        transform:translateY(100%); transition:transform .38s cubic-bezier(.22,1,.36,1);
    }
    .sheet.is-open .sheet__body { transform:translateY(0); }
    .sheet__x {
        position:absolute; top:10px; right:12px; width:34px; height:34px;
        border-radius:50%; border:1px solid var(--surface-border);
        background:rgba(158,173,196,.08); color:var(--text-dim);
        font-size:1.3rem; line-height:1; cursor:pointer; z-index:2;
        touch-action:manipulation;
    }
    .sheet__body { position:absolute; }
    .sheet__grip { width:38px; height:4px; border-radius:2px; background:var(--surface-border); margin:0 auto 14px; }
    .sheet__head { display:flex; gap:12px; align-items:center; margin-bottom:10px; }
    .sheet__emoji { font-size:2rem; width:48px; height:54px; display:flex; align-items:center; justify-content:center; flex:none;
        clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); filter:saturate(.8); }
    .sheet__meta { font-family:'JetBrains Mono', ui-monospace, monospace; font-size:.62rem;
        letter-spacing:.07em; text-transform:uppercase; color:var(--text-dim); }
    .sheet__title { font-size:1.2rem; font-weight:800; line-height:1.25; }
    .sheet__desc { color:var(--text-dim); font-size:.9rem; line-height:1.55; margin-bottom:10px; }
    .sheet__tools { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:14px; }
    .sheet__tool { font-family:'JetBrains Mono', ui-monospace, monospace; font-size:.62rem;
        color:var(--primary); background:rgba(34,224,200,.08); border:1px solid rgba(34,224,200,.35);
        padding:3px 7px; border-radius:4px; }
    .sheet__lab { font-family:'JetBrains Mono', ui-monospace, monospace; font-size:.64rem;
        letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin:14px 0 7px; }
    .sheet__list { list-style:none; display:flex; flex-direction:column; gap:6px; }
    .sheet__list li { position:relative; padding-left:16px; font-size:.86rem; line-height:1.5; color:var(--text-dim); }
    .sheet__list li::before { content:''; position:absolute; left:0; top:.5em; width:5px; height:5px;
        background:var(--branch); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); }
    .sheet__apply { font-weight:700; font-size:.92rem; line-height:1.5; margin-bottom:8px; }
    .sheet__box { font-size:.84rem; line-height:1.5; color:var(--text-dim);
        background:rgba(158,173,196,.05); border-radius:10px; padding:10px 12px; }
    .sheet__box--case { border-left:2px solid var(--branch); }
    .sheet__box--trap { border-left:2px solid #E5C07B; margin-top:10px; }
    .sheet__box--proof { border-left:2px solid var(--primary); margin-top:10px; }
    .sheet__box b { color:var(--text); }
    .sheet__steps { list-style:none; display:flex; flex-direction:column; gap:6px; }
    .sheet__step label { display:flex; gap:9px; align-items:flex-start; padding:10px 11px;
        background:rgba(158,173,196,.05); border:1px solid var(--surface-border);
        border-radius:10px; font-size:.85rem; line-height:1.45; color:var(--text-dim); }
    .sheet__step input { width:17px; height:17px; margin-top:1px; flex:none; accent-color:var(--primary); }
    .sheet__step.is-done label { border-color:var(--success); color:var(--text-dim); }
    .sheet__step.is-done span { text-decoration:line-through; }
    .sheet__go { width:100%; margin-top:16px; padding:14px; border:none; border-radius:12px;
        font-weight:800; font-size:.95rem; color:#04120F;
        background:linear-gradient(180deg, var(--primary), #12C4AE); cursor:pointer; touch-action:manipulation; }
    .sheet__go:disabled { background:rgba(158,173,196,.08); color:var(--text-dim);
        border:1px solid var(--surface-border); }
    .sheet__done { display:inline-block; font-family:'JetBrains Mono', ui-monospace, monospace;
        font-size:.62rem; letter-spacing:.07em; text-transform:uppercase;
        background:var(--success); color:#04120F; padding:4px 9px; border-radius:50px; margin-bottom:10px; }

    .footer-note { text-align: center; color: var(--text-dim); font-size: 0.72rem; margin-top: auto; padding-top: 10px; }
    .footer-note button { background: none; border: none; color: var(--text-dim); text-decoration: underline; font-size: 0.72rem; cursor: pointer; }

    /* ---------- Плавающий +XP ---------- */
    .float-xp {
        position: fixed;
        z-index: 50;
        font-weight: 800;
        font-size: 1.1rem;
        color: var(--gold);
        pointer-events: none;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        animation: floatup 0.9s ease-out forwards;
    }
    .float-xp.crit { color: var(--accent); font-size: 1.5rem; }

    /* ---------- Оверлеи церемоний ---------- */
    .overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: rgba(7, 11, 25, 0.8);
        backdrop-filter: blur(6px);
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: none;
        text-align: center;
        padding: 24px;
    }
    .overlay.show { opacity: 1; }
    .burst {
        position: absolute;
        width: 320px; height: 320px;
        background: conic-gradient(from 0deg, transparent, var(--primary), transparent, var(--accent), transparent);
        border-radius: 50%;
        animation: spin 4s linear infinite;
        opacity: 0.5;
    }
    .ceremony { position: relative; transform: scale(0.7); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .overlay.show .ceremony { transform: scale(1); }
    .ceremony__badge {
        width: 110px; height: 110px; margin: 0 auto 16px; border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        display: grid; place-items: center; font-size: 3rem; font-weight: 800;
        box-shadow: 0 0 40px var(--primary);
    }
    .ceremony__title { font-size: 2rem; font-weight: 800; margin-bottom: 6px;
        background: linear-gradient(135deg, var(--gold), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .ceremony__sub { color: var(--text-dim); }
    .ceremony__morph { font-size: 3.5rem; display: flex; gap: 14px; align-items: center; justify-content: center; margin-bottom: 14px; }

    #confetti { position: fixed; inset: 0; z-index: 120; pointer-events: none; }
    .flash { position: fixed; inset: 0; z-index: 110; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; mix-blend-mode: screen; }
    .flash.show { opacity: 0.55; }


    /* ---------- Карточка «теперь ты можешь» ---------- */
    .use-card {
        position: fixed;
        left: 12px; right: 12px;
        bottom: calc(var(--safe-b) + 16px);
        z-index: 95;
        background: var(--bg2);
        border: 1px solid var(--surface-border);
        border-left: 3px solid var(--primary);
        border-radius: 14px;
        padding: 14px 16px;
        box-shadow: 0 18px 44px -18px #000;
        transform: translateY(140%);
        transition: transform .38s cubic-bezier(.34,1.56,.64,1);
    }
    .use-card.show { transform: translateY(0); }
    .use-card__top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .use-card__emoji { font-size: 1.3rem; }
    .use-card__label {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: .66rem; letter-spacing: .08em; text-transform: uppercase;
        color: var(--primary);
    }
    .use-card__text { font-size: .9rem; line-height: 1.5; color: var(--text); }

    /* ---------- Анимации ---------- */

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes shimmer { to { background-position: 200% 0; } }
    @keyframes ripple { to { transform: translate(-50%, -50%) scale(6); opacity: 0; } }
    @keyframes floatup { to { transform: translateY(-60px); opacity: 0; } }
    @keyframes pulse-border { 0%,100% { box-shadow: 0 0 0 0 rgba(139, 124, 255, 0.4); } 50% { box-shadow: 0 0 0 6px rgba(236, 72, 153, 0); } }

    @media (prefers-reduced-motion: reduce) {
        .mascot__emoji, .mascot__glow, .xp__fill, .burst, .skill.is-available { animation: none !important; }
    }

    .install-tip {
        position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-b) + 12px);
        z-index: 90; background: var(--bg2); border: 1px solid var(--surface-border);
        border-radius: 14px; padding: 12px 14px; display: none; align-items: center; gap: 10px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 0.82rem;
    }
    .install-tip.show { display: flex; }
    .install-tip button { margin-left: auto; background: var(--primary); color: #fff; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<script src="data/curriculum.js"></script>
<canvas id="fx"></canvas>

<div class="app">
    <div class="top">
        <div class="brand"><img src="icon.svg" alt="" width="26" height="26" style="vertical-align:-5px;border-radius:6px"> MedoEDU<b>z</b></div>
        <div class="level-pill">⚡ Ур. <b id="lvl">1</b></div>
    </div>

    <div class="hero">
        <div class="mascot">
            <div class="mascot__glow"></div>
            <div class="mascot__emoji" id="mascot">🦡</div>
        </div>
        <div class="stage-name" id="stageName">Медвежонок</div>
        <div class="stage-sub" id="stageSub">Только начал свой путь</div>
    </div>

    <div class="xp">
        <div class="xp__row"><span>Опыт</span><span id="xpText">0 / 60 XP</span></div>
        <div class="xp__bar"><div class="xp__fill" id="xpFill"></div></div>
    </div>

    <div class="tap-wrap">
        <button class="tap" id="tapBtn">
            <span class="tap__label">ИЗУЧАТЬ</span>
            <span class="tap__hint">нажимай и расти 🚀</span>
        </button>
    </div>

    <div class="sec-label">Граф знаний<span class="sec-count" id="graphCount">0 / 0</span></div>

    <!-- Граф растёт по мере освоения: закрытые узлы скрыты, соседние
         проявляются, освоенные соединяются светящимися рёбрами. -->
    <div class="graph" id="graphStage">
        <svg class="graph__svg" id="graphSvg" aria-label="Граф знаний"></svg>
        <div class="graph__ctrl">
            <button id="gZoomIn" aria-label="Приблизить">+</button>
            <button id="gZoomOut" aria-label="Отдалить">−</button>
            <button id="gFit" aria-label="Вписать">⤢</button>
        </div>
        <span class="graph__hint">Тяните, чтобы двигать · нажмите узел</span>
    </div>

    <div class="sec-label">Освоение по направлениям</div>
    <div class="bars" id="branchBars"></div>

    <div class="footer-note">
        Медоеду ВСЁ! · Прогресс сохраняется на устройстве ·
        <button id="resetBtn">сброс</button>
    </div>
</div>

<div class="install-tip" id="installTip">
    <span>📲 Установить как приложение для офлайн-доступа</span>
    <button id="installBtn">Установить</button>
</div>

<script>
(function () {
    'use strict';

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var $ = function (id) { return document.getElementById(id); };

    // ---------- Модель ----------
    var STAGES = [
        { e: '🦡', n: 'Медоедёнок', s: 'Только начал свой путь', a: '#a3a3a3', lvl: 1 },
        { e: '⚡', n: 'Любопытный', s: 'Исследует экосистему', a: '#22d3ee', lvl: 3 },
        { e: '🤖', n: 'Ученик ИИ', s: 'Освоил первые инструменты', a: '#38bdf8', lvl: 5 },
        { e: '🦾', n: 'Нейро-Мастер', s: 'Уверенно владеет ИИ', a: '#8b5cf6', lvl: 8 },
        { e: '🧠', n: 'Гуру ИИ', s: 'Видит матрицу насквозь', a: '#f5a524', lvl: 11 },
        { e: '👑', n: 'Медоед ВСЁ', s: 'Легенда экосистемы', a: '#fb7185', lvl: 14 }
    ];

    // Единый источник истины — та же модель, что и на сайте
    // (data/curriculum.js синхронизируется сборщиком build-app.sh).
    var C = window.CURRICULUM;
    var NODES = C.NODES, BRANCHES = C.BRANCHES, BY_ID = C.BY_ID;

    var KEY = 'medoeduz_app_v1';
    var S = load();

    function load() {
        try {
            var d = JSON.parse(localStorage.getItem(KEY) || '{}');
            return { xp: d.xp || 0, level: d.level || 1, skills: d.skills || [], quests: d.quests || {} };
        } catch (e) { return { xp: 0, level: 1, skills: [], quests: {} }; }
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

    function need(l) { return Math.round(60 * Math.pow(1.3, l - 1)); }
    function totalFor(l) { var t = 0; for (var i = 1; i < l; i++) t += need(i); return t; }
    function progress() {
        var base = totalFor(S.level), next = totalFor(S.level + 1);
        return { cur: S.xp - base, total: next - base, pct: Math.min(100, (S.xp - base) / (next - base) * 100) };
    }
    function stage() { var r = STAGES[0]; for (var i = 0; i < STAGES.length; i++) if (S.level >= STAGES[i].lvl) r = STAGES[i]; return r; }
    function stageIndex() { var idx = 0; for (var i = 0; i < STAGES.length; i++) if (S.level >= STAGES[i].lvl) idx = i; return idx; }

    // ---------- XP / уровни / эволюция ----------
    function addXP(n, x, y, crit) {
        var prevLevel = S.level, prevStage = stageIndex();
        S.xp += n;
        while (S.xp >= totalFor(S.level + 1)) S.level++;

        floatXP(n, x, y, crit);
        if (S.level > prevLevel) { levelCeremony(S.level); haptic([20, 40, 20]); }
        var ns = stageIndex();
        if (ns > prevStage) evolveCeremony(STAGES[prevStage], STAGES[ns]);

        save();
        render();
    }

    // ---------- Состояния узлов графа ----------
    function isDone(id) { return S.skills.indexOf(id) !== -1; }

    function nodeState(n) {
        if (isDone(n.id)) return 'done';
        var prereqOk = n.prereqs.every(isDone);
        return (prereqOk && S.level >= n.reqLevel) ? 'available' : 'locked';
    }

    /**
     * Видимость узла — «туман войны».
     * Показываем освоенные, доступные и их прямых наследников.
     * Остальное скрыто: граф не выдаётся целиком, а ПРОРАСТАЕТ
     * по мере освоения — в этом и есть визуальный прогресс.
     */
    function isVisible(n) {
        if (nodeState(n) !== 'locked') return true;
        return n.prereqs.some(function (p) {
            var pn = BY_ID[p];
            return pn && nodeState(pn) !== 'locked';
        });
    }

    // ---------- Геометрия графа ----------
    var GW = 150, GH = 118, GM = 70, R = 21;
    function pos(n) { return { x: GM + n.col * GW, y: GM + n.row * GH }; }

    var gsvg, gvp, gview = { x: 0, y: 0, k: 1 }, gdrag = null, gpinch = null;
    var seen = {};   // какие узлы уже проявлялись — чтобы анимировать только новые

    function SVG(tag, attrs) {
        var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        return e;
    }

    function buildGraph() {
        gsvg = $('graphSvg');
        gsvg.innerHTML = '';
        gvp = SVG('g', {});
        gsvg.appendChild(gvp);
        drawGraph();
        fitGraph();
        bindGraph();
    }

    function drawGraph() {
        gvp.innerHTML = '';
        var edges = SVG('g', {}), nodes = SVG('g', {});
        gvp.appendChild(edges); gvp.appendChild(nodes);

        NODES.forEach(function (n) {
            if (!isVisible(n)) return;
            var to = pos(n);
            n.prereqs.forEach(function (pid) {
                var pn = BY_ID[pid];
                if (!pn || !isVisible(pn)) return;
                var from = pos(pn);
                var dy = (to.y - R - (from.y + R)) * 0.5;
                var cls = 'ge' + (isDone(pid) && isDone(n.id) ? ' is-full'
                                : isDone(pid) ? ' is-half' : '');
                edges.appendChild(SVG('path', {
                    class: cls,
                    d: 'M ' + from.x + ' ' + (from.y + R) +
                       ' C ' + from.x + ' ' + (from.y + R + dy) + ', ' +
                       to.x + ' ' + (to.y - R - dy) + ', ' + to.x + ' ' + (to.y - R)
                }));
            });
        });

        NODES.forEach(function (n) {
            if (!isVisible(n)) return;
            var p = pos(n), st = nodeState(n), br = BRANCHES[n.branch];
            var fresh = !seen[n.id];
            seen[n.id] = 1;

            var g = SVG('g', {
                class: 'gn is-' + st + (fresh ? ' is-new' : ''),
                transform: 'translate(' + p.x + ',' + p.y + ')',
                role: 'button', tabindex: '0'
            });
            g.style.setProperty('--branch', br.color);

            // Внутренняя группа: CSS-анимация не должна перетирать
            // атрибут transform, который позиционирует узел.
            var inner = SVG('g', { class: 'gn__inner' });
            inner.appendChild(SVG('circle', { class: 'gn__halo', r: R + 6, fill: br.color }));
            inner.appendChild(SVG('circle', { class: 'gn__circle', r: R }));

            var ic = SVG('text', { class: 'gn__icon', 'text-anchor': 'middle',
                                   'dominant-baseline': 'central', y: 1 });
            ic.textContent = st === 'locked' ? '🔒' : n.emoji;
            inner.appendChild(ic);

            var words = n.title.split(' '), line = '', lines = [];
            words.forEach(function (w) {
                if ((line + ' ' + w).trim().length > 13) { lines.push(line.trim()); line = w; }
                else line = (line + ' ' + w).trim();
            });
            if (line) lines.push(line);
            lines.slice(0, 2).forEach(function (ln, i) {
                var t = SVG('text', { class: 'gn__label', 'text-anchor': 'middle', y: R + 13 + i * 10 });
                t.textContent = ln;
                inner.appendChild(t);
            });

            g.appendChild(inner);
            g.addEventListener('click', function () { openSheet(n); });
            nodes.appendChild(g);
        });

        var done = NODES.filter(function (n) { return isDone(n.id); }).length;
        $('graphCount').textContent = done + ' / ' + NODES.length;
    }

    function applyG() {
        gvp.setAttribute('transform', 'translate(' + gview.x + ',' + gview.y + ') scale(' + gview.k + ')');
    }

    function fitGraph() {
        var vis = NODES.filter(isVisible).map(pos);
        if (!vis.length) return;
        var r = gsvg.getBoundingClientRect();
        var minX = Math.min.apply(null, vis.map(function (p) { return p.x; })) - R - 30;
        var maxX = Math.max.apply(null, vis.map(function (p) { return p.x; })) + R + 30;
        var minY = Math.min.apply(null, vis.map(function (p) { return p.y; })) - R - 20;
        var maxY = Math.max.apply(null, vis.map(function (p) { return p.y; })) + R + 40;
        var k = Math.min(r.width / (maxX - minX), r.height / (maxY - minY));
        gview.k = Math.max(0.35, Math.min(1.6, k));
        gview.x = (r.width - (maxX - minX) * gview.k) / 2 - minX * gview.k;
        gview.y = (r.height - (maxY - minY) * gview.k) / 2 - minY * gview.k;
        applyG();
    }

    function zoomBy(f) {
        var r = gsvg.getBoundingClientRect(), cx = r.width / 2, cy = r.height / 2;
        var k = Math.max(0.35, Math.min(2.2, gview.k * f));
        gview.x = cx - (cx - gview.x) * (k / gview.k);
        gview.y = cy - (cy - gview.y) * (k / gview.k);
        gview.k = k; applyG();
    }

    function bindGraph() {
        var stage = $('graphStage');
        stage.addEventListener('touchstart', function (e) {
            if (e.touches.length === 1) {
                gdrag = { x: e.touches[0].clientX - gview.x, y: e.touches[0].clientY - gview.y };
            } else if (e.touches.length === 2) {
                gdrag = null;
                gpinch = { d: dist(e.touches), k: gview.k };
            }
        }, { passive: true });

        stage.addEventListener('touchmove', function (e) {
            if (gpinch && e.touches.length === 2) {
                var k = Math.max(0.35, Math.min(2.2, gpinch.k * (dist(e.touches) / gpinch.d)));
                gview.k = k; applyG();
            } else if (gdrag && e.touches.length === 1) {
                gview.x = e.touches[0].clientX - gdrag.x;
                gview.y = e.touches[0].clientY - gdrag.y;
                applyG();
            }
        }, { passive: true });

        stage.addEventListener('touchend', function () { gdrag = null; gpinch = null; });

        // мышь — для десктопного просмотра приложения
        stage.addEventListener('mousedown', function (e) {
            if (e.target.closest('.gn') || e.target.closest('.graph__ctrl')) return;
            gdrag = { x: e.clientX - gview.x, y: e.clientY - gview.y };
        });
        window.addEventListener('mousemove', function (e) {
            if (!gdrag) return;
            gview.x = e.clientX - gdrag.x; gview.y = e.clientY - gdrag.y; applyG();
        });
        window.addEventListener('mouseup', function () { gdrag = null; });

        $('gZoomIn').addEventListener('click', function () { zoomBy(1.25); });
        $('gZoomOut').addEventListener('click', function () { zoomBy(0.8); });
        $('gFit').addEventListener('click', fitGraph);
        window.addEventListener('resize', fitGraph);
    }

    function dist(t) {
        var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
        return Math.hypot(dx, dy) || 1;
    }

    // ---------- Прогресс по веткам ----------
    function renderBars() {
        var wrap = $('branchBars');
        var html = '';
        Object.keys(BRANCHES).forEach(function (key) {
            var br = BRANCHES[key];
            var all = NODES.filter(function (n) { return n.branch === key; });
            if (!all.length) return;
            var done = all.filter(function (n) { return isDone(n.id); }).length;
            var pct = Math.round(done / all.length * 100);
            html += '<div class="bar">' +
                '<div class="bar__top"><span class="bar__name">' + br.emoji + ' ' + br.name + '</span>' +
                '<span class="bar__num">' + done + '/' + all.length + '</span></div>' +
                '<div class="bar__track"><div class="bar__fill" style="width:' + pct +
                '%;background:' + br.color + '"></div></div></div>';
        });
        wrap.innerHTML = html;
    }

    // ---------- Шторка курса ----------
    var sheet, sheetNode;

    function buildSheet() {
        sheet = document.createElement('div');
        sheet.className = 'sheet';
        sheet.innerHTML = '<div class="sheet__bg"></div><div class="sheet__body"></div>';
        document.body.appendChild(sheet);
        sheet.querySelector('.sheet__bg').addEventListener('click', closeSheet);

        // Свайп вниз по верхней зоне шторки — привычный жест закрытия.
        // Без него на мобильном закрыть можно было только крестиком.
        var sy = null, body = sheet.querySelector('.sheet__body');
        body.addEventListener('touchstart', function (e) {
            if (body.scrollTop > 4) return;   // не мешаем прокрутке содержимого
            sy = e.touches[0].clientY;
        }, { passive: true });
        body.addEventListener('touchmove', function (e) {
            if (sy === null) return;
            var d = e.touches[0].clientY - sy;
            if (d > 0) body.style.transform = 'translateY(' + d + 'px)';
        }, { passive: true });
        body.addEventListener('touchend', function (e) {
            if (sy === null) return;
            var d = (e.changedTouches[0].clientY - sy);
            body.style.transform = '';
            if (d > 90) closeSheet();
            sy = null;
        });
    }

    function esc(t) {
        return String(t).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
    }

    function questDone(id) { return S.quests[id] || []; }

    function openSheet(n) {
        if (!sheet) buildSheet();
        sheetNode = n;
        renderSheet();
        sheet.classList.add('is-open');
    }

    function closeSheet() { if (sheet) sheet.classList.remove('is-open'); }

    function renderSheet() {
        var n = sheetNode, br = BRANCHES[n.branch];
        var st = nodeState(n), done = questDone(n.id), body = sheet.querySelector('.sheet__body');
        var all = done.length === n.quest.steps.length;
        body.style.setProperty('--branch', br.color);

        body.innerHTML =
            '<button class="sheet__x" aria-label="Закрыть">&times;</button>' +
            '<div class="sheet__grip"></div>' +
            '<div class="sheet__head">' +
                '<span class="sheet__emoji" style="background:' + br.color + '22">' +
                    (st === 'locked' ? '🔒' : n.emoji) + '</span>' +
                '<div><div class="sheet__meta">' + br.emoji + ' ' + esc(br.name) +
                    ' · ур. ' + n.reqLevel + ' · +' + n.xp + ' XP</div>' +
                '<div class="sheet__title">' + esc(n.title) + '</div></div>' +
            '</div>' +
            (st === 'done' ? '<div class="sheet__done">✓ освоено</div>' : '') +
            '<p class="sheet__desc">' + esc(n.desc) + '</p>' +
            '<div class="sheet__tools">' +
                n.tools.map(function (t) { return '<span class="sheet__tool">' + esc(t) + '</span>'; }).join('') +
            '</div>' +
            '<div class="sheet__lab">Программа</div>' +
            '<ul class="sheet__list">' +
                n.learn.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') +
            '</ul>' +
            '<div class="sheet__lab">Что сможете сразу</div>' +
            '<p class="sheet__apply">' + esc(n.apply.now) + '</p>' +
            '<div class="sheet__box sheet__box--case"><b>Пример.</b> ' + esc(n.apply.case) + '</div>' +
            '<div class="sheet__box sheet__box--trap"><b>Частая ошибка.</b> ' + esc(n.trap) + '</div>' +
            '<div class="sheet__lab">Миссия · ' + esc(n.quest.title) + '</div>' +
            (st === 'locked'
                ? '<div class="sheet__box">Узел закроется, пока не освоены предыдущие навыки и не достигнут уровень ' + n.reqLevel + '.</div>'
                : '<ul class="sheet__steps">' +
                    n.quest.steps.map(function (s2, i) {
                        return '<li class="sheet__step' + (done.indexOf(i) !== -1 ? ' is-done' : '') + '">' +
                            '<label><input type="checkbox" data-s="' + i + '"' +
                            (done.indexOf(i) !== -1 ? ' checked' : '') + '><span>' + esc(s2) + '</span></label></li>';
                    }).join('') +
                  '</ul>') +
            '<div class="sheet__box sheet__box--proof"><b>Результат:</b> ' + esc(n.quest.proof) + '</div>' +
            (st === 'available'
                ? '<button class="sheet__go" id="sheetGo"' + (all ? '' : ' disabled') + '>' +
                    (all ? 'Освоить · +' + n.xp + ' XP'
                         : 'Отметьте все шаги (' + done.length + '/' + n.quest.steps.length + ')') +
                  '</button>'
                : '');

        // Точечное обновление: полная перерисовка сбрасывала бы прокрутку,
        // а миссия находится внизу длинной шторки.
        body.querySelectorAll('input[data-s]').forEach(function (box) {
            box.addEventListener('change', function () {
                var list = S.quests[n.id] || [];
                var idx = Number(box.dataset.s), at = list.indexOf(idx);
                if (at === -1) list.push(idx); else list.splice(at, 1);
                S.quests[n.id] = list; save();
                box.closest('.sheet__step').classList.toggle('is-done', box.checked);
                var go = document.getElementById('sheetGo');
                if (go) {
                    var ok = list.length === n.quest.steps.length;
                    go.disabled = !ok;
                    go.textContent = ok ? 'Освоить · +' + n.xp + ' XP'
                        : 'Отметьте все шаги (' + list.length + '/' + n.quest.steps.length + ')';
                }
            });
        });

        var x = body.querySelector('.sheet__x');
        if (x) x.addEventListener('click', closeSheet);

        var go = document.getElementById('sheetGo');
        if (go) go.addEventListener('click', function () { masterNode(n); });
    }

    // ---------- Освоение узла ----------
    function masterNode(n) {
        if (isDone(n.id)) return;
        S.skills.push(n.id);
        save();
        var r = $('graphStage').getBoundingClientRect();
        addXP(n.xp, r.left + r.width / 2, r.top + 40, true);
        haptic([12, 30, 12]);
        drawGraph();
        renderBars();
        renderSheet();
        showUse(n);
        checkSyn();
        if (n.id === 'apex') { confetti(); flash('#FF7A85'); }
    }

    /** Карточка «теперь ты можешь» — то, ради чего осваивался навык */
    function showUse(n) {
        var old = document.querySelector('.use-card');
        if (old) old.remove();
        var c = document.createElement('div');
        c.className = 'use-card';
        c.innerHTML = '<div class="use-card__top"><span class="use-card__emoji">' + n.emoji +
            '</span><span class="use-card__label">Теперь ты можешь</span></div>' +
            '<p class="use-card__text">' + esc(n.apply.now) + '</p>';
        document.body.appendChild(c);
        requestAnimationFrame(function () { c.classList.add('show'); });
        setTimeout(function () {
            c.classList.remove('show');
            setTimeout(function () { c.remove(); }, 350);
        }, 5000);
    }

    /** Синергии: комбинации навыков из разных веток */
    function checkSyn() {
        if (!C.SYNERGIES) return;
        S.syn = S.syn || [];
        C.SYNERGIES.forEach(function (sy) {
            if (S.syn.indexOf(sy.id) !== -1) return;
            if (!sy.nodes.every(isDone)) return;
            S.syn.push(sy.id); save();
            var c = document.createElement('div');
            c.className = 'use-card';
            c.innerHTML = '<div class="use-card__top"><span class="use-card__emoji">' + sy.emoji +
                '</span><span class="use-card__label" style="color:var(--accent)">Синергия открыта · ' +
                esc(sy.name) + '</span></div><p class="use-card__text">' + esc(sy.gives) + '</p>';
            document.body.appendChild(c);
            requestAnimationFrame(function () { c.classList.add('show'); });
            confetti();
            setTimeout(function () {
                c.classList.remove('show');
                setTimeout(function () { c.remove(); }, 350);
            }, 5600);
        });
    }

    // ---------- Рендер ----------
    function render() {
        var st = stage(), p = progress();
        document.documentElement.style.setProperty('--aura', st.a);
        $('mascot').textContent = st.e;
        $('stageName').textContent = st.n;
        $('stageSub').textContent = st.s;
        $('lvl').textContent = S.level;
        $('xpText').textContent = Math.floor(p.cur) + ' / ' + p.total + ' XP';
        $('xpFill').style.width = p.pct + '%';
        if (gvp) drawGraph();
        renderBars();
    }

    // ---------- Визуальные эффекты ----------
    function floatXP(n, x, y, crit) {
        if (x == null) { x = window.innerWidth / 2; y = window.innerHeight / 2; }
        var f = document.createElement('div');
        f.className = 'float-xp' + (crit ? ' crit' : '');
        f.textContent = '+' + n + ' XP';
        f.style.left = x + 'px';
        f.style.top = y + 'px';
        f.style.transform = 'translate(-50%,-50%)';
        document.body.appendChild(f);
        setTimeout(function () { f.remove(); }, 900);
    }

    function shake(el) {
        if (reduce) return;
        el.animate(
            [{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }],
            { duration: 350 }
        );
    }

    function levelCeremony(lvl) {
        var o = document.createElement('div');
        o.className = 'overlay';
        o.innerHTML = '<div class="burst"></div><div class="ceremony"><div class="ceremony__badge">' + lvl +
            '</div><div class="ceremony__title">Новый уровень!</div><div class="ceremony__sub">Ты достиг ' + lvl + ' уровня</div></div>';
        document.body.appendChild(o);
        requestAnimationFrame(function () { o.classList.add('show'); });
        confetti();
        setTimeout(function () { o.classList.remove('show'); setTimeout(function () { o.remove(); }, 400); }, 2200);
    }

    function evolveCeremony(from, to) {
        var o = document.createElement('div');
        o.className = 'overlay';
        o.innerHTML = '<div class="burst"></div><div class="ceremony"><div class="ceremony__morph"><span>' + from.e +
            '</span><span>⟶</span><span>' + to.e + '</span></div><div class="ceremony__title">ЭВОЛЮЦИЯ!</div>' +
            '<div class="ceremony__sub">' + from.n + ' → <b>' + to.n + '</b></div></div>';
        document.body.appendChild(o);
        requestAnimationFrame(function () { o.classList.add('show'); });
        confetti(); flash(to.a); haptic([30, 50, 30, 50, 60]);
        setTimeout(function () { o.classList.remove('show'); setTimeout(function () { o.remove(); }, 400); }, 3000);
    }

    function confetti() {
        if (reduce) return;
        var c = document.createElement('canvas');
        c.id = 'confetti';
        c.width = innerWidth; c.height = innerHeight;
        document.body.appendChild(c);
        var ctx = c.getContext('2d');
        var colors = ['#8B7CFF', '#FF8FD0', '#FFB020', '#3FD87A', '#57C7FF'];
        var P = [];
        for (var i = 0; i < 120; i++) P.push({
            x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.3,
            r: Math.random() * 7 + 3, col: colors[(Math.random() * colors.length) | 0],
            vx: (Math.random() - 0.5) * 6, vy: Math.random() * 4 + 3, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3
        });
        var frames = 0;
        (function draw() {
            ctx.clearRect(0, 0, c.width, c.height);
            for (var i = 0; i < P.length; i++) {
                var p = P[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.rot += p.vr;
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col;
                ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6); ctx.restore();
            }
            if (++frames < 180) requestAnimationFrame(draw); else c.remove();
        })();
    }

    function flash(color) {
        if (reduce) return;
        var f = document.createElement('div');
        f.className = 'flash';
        f.style.background = color;
        document.body.appendChild(f);
        requestAnimationFrame(function () { f.classList.add('show'); });
        setTimeout(function () { f.classList.remove('show'); setTimeout(function () { f.remove(); }, 300); }, 450);
    }

    function haptic(pattern) {
        try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
    }

    // ---------- Кнопка изучения ----------
    var tap = $('tapBtn');
    tap.addEventListener('click', function (e) {
        var rect = tap.getBoundingClientRect();
        var rip = document.createElement('span');
        rip.className = 'ripple';
        var size = 40;
        rip.style.width = rip.style.height = size + 'px';
        rip.style.left = (e.clientX - rect.left) + 'px';
        rip.style.top = (e.clientY - rect.top) + 'px';
        tap.appendChild(rip);
        setTimeout(function () { rip.remove(); }, 600);

        var crit = Math.random() < 0.12;
        var gain = crit ? 25 : (3 + (Math.random() * 5 | 0));
        haptic(crit ? [10, 30, 10] : 8);
        addXP(gain, e.clientX, e.clientY - 30, crit);
    });

    // ---------- Фоновые частицы ----------
    (function particles() {
        if (reduce) return;
        var canvas = $('fx'), ctx = canvas.getContext('2d');
        var ps = [], W, H;
        function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
        resize(); addEventListener('resize', resize);
        var count = Math.min(60, Math.floor(innerWidth / 8));
        for (var i = 0; i < count; i++) ps.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, r: Math.random() * 2 + 1 });
        var pointer = { x: W / 2, y: H / 2 };
        addEventListener('pointermove', function (e) { pointer.x = e.clientX; pointer.y = e.clientY; }, { passive: true });

        function rgba(hex, a) {
            hex = hex.replace('#', ''); if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
            return 'rgba(' + parseInt(hex.substr(0,2),16) + ',' + parseInt(hex.substr(2,2),16) + ',' + parseInt(hex.substr(4,2),16) + ',' + a + ')';
        }
        (function loop() {
            ctx.clearRect(0, 0, W, H);
            var accent = getComputedStyle(document.documentElement).getPropertyValue('--aura').trim() || '#6366f1';
            for (var i = 0; i < ps.length; i++) {
                var p = ps[i]; p.x += p.vx; p.y += p.vy;
                var dx = pointer.x - p.x, dy = pointer.y - p.y, d = Math.hypot(dx, dy);
                if (d < 160) { p.x += dx / d * 0.3; p.y += dy / d * 0.3; }
                if (p.x < 0 || p.x > W) p.vx *= -1;
                if (p.y < 0 || p.y > H) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fillStyle = rgba(accent, 0.6); ctx.fill();
                for (var j = i + 1; j < ps.length; j++) {
                    var q = ps[j], dd = Math.hypot(p.x - q.x, p.y - q.y);
                    if (dd < 110) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.strokeStyle = rgba(accent, 0.12 * (1 - dd / 110)); ctx.lineWidth = 1; ctx.stroke(); }
                }
            }
            requestAnimationFrame(loop);
        })();
    })();

    // ---------- Сброс ----------
    $('resetBtn').addEventListener('click', function () {
        if (confirm('Сбросить весь прогресс?')) { S = { xp: 0, level: 1, skills: [], quests: {} }; save(); render(); }
    });

    // ---------- Установка PWA ----------
    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault(); deferredPrompt = e; $('installTip').classList.add('show');
    });
    $('installBtn').addEventListener('click', function () {
        $('installTip').classList.remove('show');
        if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
    });

    // ---------- Service Worker (офлайн), только по http(s) ----------
    if ('serviceWorker' in navigator &&
        (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
    }

    // ---------- Старт ----------
    // Без модели приложение бессмысленно — сообщаем честно,
    // а не падаем с пустым экраном.
    if (!window.CURRICULUM) {
        document.getElementById('graphStage').innerHTML =
            '<p style="padding:24px;color:#9FADC0;font-size:.9rem;text-align:center">' +
            'Не загрузилась модель курса (data/curriculum.js).</p>';
    } else {
        buildGraph();
        checkSyn();
    }
    render();
})();
</script>
</body>
</html>
